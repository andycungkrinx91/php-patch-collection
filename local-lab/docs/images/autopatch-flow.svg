<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="33%" stop-color="#0D9488" />
      <stop offset="66%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>

  <style>
    .title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #0F172A; }
    .subtitle { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #64748B; }
    .badge { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #1D4ED8; }
    .node-title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
    .node-desc { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; fill: #475569; }
    .node-code { font-family: Consolas, 'Fira Code', monospace; font-size: 10px; fill: #2563EB; }
    .branch-lbl { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #64748B; }
    .verdict-title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #15803D; }
    .verdict-desc { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #166534; }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1000" height="680" fill="#FFFFFF" rx="10" />

  <!-- Header Section -->
  <text x="35" y="42" class="title">universal-autopatch-109618-109619.sh &mdash; Execution &amp; Decision Flow</text>
  <text x="35" y="62" class="subtitle">Autonomous Discovery &middot; Cryptographic Checksum Gates &middot; Zend VM Regeneration &middot; In-Place Binary Hot-Swap</text>

  <rect x="830" y="24" width="135" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
  <text x="897" y="41" text-anchor="middle" class="badge">DEFENSE IN DEPTH</text>

  <!-- Accent Gradient Ribbon -->
  <rect x="35" y="76" width="930" height="4" rx="2" fill="url(#ribbonGrad)" />

  <!-- STAGE 1: Invocation & Environment -->
  <rect x="35" y="105" width="260" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="60" cy="130" r="14" fill="#2563EB" />
  <text x="60" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">1</text>
  <text x="84" y="129" class="node-title">CLI Execution &amp; Env Probe</text>
  <text x="84" y="145" class="node-desc">Probes virtualization environment:</text>
  <text x="84" y="160" class="node-code">systemd-detect-virt | /.dockerenv</text>
  <text x="84" y="174" class="node-desc">Identifies: Bare-Metal, LXC, Docker, VM</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="295" y1="150" x2="360" y2="150" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 2: OS Detection -->
  <rect x="365" y="105" width="270" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="390" cy="130" r="14" fill="#2563EB" />
  <text x="390" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">2</text>
  <text x="414" y="129" class="node-title">OS &amp; Distribution Detection</text>
  <text x="414" y="145" class="node-desc">Parses /etc/os-release &amp; release files:</text>
  <text x="414" y="160" class="node-code">Ubuntu, Debian, CentOS, Alpine</text>
  <text x="414" y="174" class="node-desc">Fail-closed: Refuses unmanaged RHEL</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="635" y1="150" x2="700" y2="150" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 3: PHP Runtime Discovery -->
  <rect x="705" y="105" width="260" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="730" cy="130" r="14" fill="#2563EB" />
  <text x="730" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">3</text>
  <text x="754" y="129" class="node-title">PHP Runtime Discovery</text>
  <text x="754" y="145" class="node-desc">Detects CLI, daemon, modules &amp; epoch:</text>
  <text x="754" y="160" class="node-code">php -v | php -r 'echo PHP_VERSION;'</text>
  <text x="754" y="174" class="node-desc">Validates: 5.5 &le; PHP &le; 8.1 (EOL scope)</text>

  <!-- Connector from Row 1 to Row 2 -->
  <path d="M 835 195 L 835 235 L 165 235 L 165 260" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 4: Patch Selection & Cryptographic Gate -->
  <rect x="35" y="265" width="310" height="100" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="60" cy="292" r="14" fill="#0D9488" />
  <text x="60" y="297" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">4</text>
  <text x="84" y="290" class="node-title">Patch Selection &amp; SHA-256 Gate</text>
  <text x="84" y="306" class="node-desc">Matches patch for detected Major.Minor:</text>
  <text x="84" y="321" class="node-code">php${PHP_MAJOR_MINOR}-cve-*.patch</text>
  <text x="84" y="335" class="node-desc">Asserts strict SHA-256 equality pin</text>
  <text x="84" y="349" class="node-desc">Dry-run verification under strict --fuzz=0</text>

  <!-- Split Fork: Arrow to Branch A and Branch B -->
  <path d="M 345 315 L 395 315" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- BRANCH A: Configuration Hardening (--apply) -->
  <rect x="400" y="240" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#cardShadow)" />
  <text x="415" y="259" class="node-title" fill="#1E40AF">Branch A: Configuration Hardening</text>
  <text x="415" y="274" class="node-desc">Deploys 99-cve-2026-hardening.ini to conf.d</text>
  <text x="415" y="288" class="node-code">nesting=20 | vars=200 | post_max=900K</text>
  <text x="415" y="301" class="node-desc">Deploys Nginx snippet cve-2026-hardening.conf</text>

  <!-- BRANCH B: C-Source Rebuild (--build-binary) -->
  <rect x="400" y="325" width="270" height="80" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#cardShadow)" />
  <text x="415" y="344" class="node-title" fill="#15803D">Branch B: C-Source In-Place Rebuild</text>
  <text x="415" y="359" class="node-desc">Dispatches to compile-and-patch-vm-cve.sh</text>
  <text x="415" y="373" class="node-desc">Pulls pristine source from php.net / museum</text>
  <text x="415" y="388" class="node-code">tools/range-patches/ (1-line context)</text>

  <!-- Arrow from Branch B to Stage 5 -->
  <path d="M 670 365 L 720 365" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 5: Zend VM Opcode Regeneration -->
  <rect x="725" y="325" width="240" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="750" cy="350" r="14" fill="#7C3AED" />
  <text x="750" y="355" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">5</text>
  <text x="772" y="348" class="node-title">Zend VM Regeneration</text>
  <text x="772" y="364" class="node-desc">Patches Zend/zend_vm_def.h</text>
  <text x="772" y="379" class="node-code">php Zend/zend_vm_gen.php</text>
  <text x="772" y="393" class="node-desc">Regenerates 34 safe error sites</text>

  <!-- Connector from Row 2 to Row 3 -->
  <path d="M 845 405 L 845 440 L 165 440 L 165 465" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 670 275 L 700 275 L 700 440" fill="none" stroke="#64748B" stroke-width="1.5" />

  <!-- STAGE 6: Atomic Hot-Swap & Backups -->
  <rect x="35" y="470" width="310" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="60" cy="497" r="14" fill="#0D9488" />
  <text x="60" y="502" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">6</text>
  <text x="84" y="495" class="node-title">Atomic Backup &amp; Binary Hot-Swap</text>
  <text x="84" y="511" class="node-desc">Creates /var/backups/php-cve-mitigation/</text>
  <text x="84" y="526" class="node-code">cp php-fpm php-fpm.pre-cve.bak</text>
  <text x="84" y="540" class="node-desc">Atomically replaces /usr/bin/php &amp; php-fpm</text>
  <text x="84" y="554" class="node-desc">Zero downtime, exact ABI preservation</text>

  <!-- Arrow 6 -> 7 -->
  <line x1="345" y1="517" x2="400" y2="517" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- STAGE 7: Daemon Reload & Verification Gate -->
  <rect x="405" y="470" width="270" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="430" cy="497" r="14" fill="#0D9488" />
  <text x="430" y="502" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">7</text>
  <text x="454" y="495" class="node-title">FPM Reload &amp; Scanner QA</text>
  <text x="454" y="511" class="node-desc">Sends graceful reload to FPM master:</text>
  <text x="454" y="526" class="node-code">systemctl reload php-fpm | kill -USR2</text>
  <text x="454" y="540" class="node-desc">Runs Assetnote multipart regression probe</text>
  <text x="454" y="554" class="node-desc">Confirms 0 SIGSEGV crashes in error log</text>

  <!-- Arrow 7 -> Final Gate -->
  <line x1="675" y1="517" x2="725" y2="517" stroke="#15803D" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- FINAL VERDICT BOX -->
  <rect x="730" y="465" width="235" height="105" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" filter="url(#cardShadow)" />
  <circle cx="755" cy="495" r="14" fill="#16A34A" />
  <text x="755" y="501" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">&check;</text>
  <text x="778" y="493" class="verdict-title">PATCHED &middot; PASS</text>
  <text x="778" y="510" class="verdict-desc">HTTP Status: 200 OK</text>
  <text x="778" y="525" class="verdict-desc">Scanner Verdict: NO SIGNAL</text>
  <text x="778" y="540" class="verdict-desc">0 Vulnerable &middot; 0 Inconclusive</text>
  <text x="778" y="555" class="verdict-desc">Verified across 10 Lab Targets</text>

  <!-- Footer Legend -->
  <rect x="35" y="605" width="930" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="50" y="634" font-family="Calibri, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">
    <tspan font-weight="700" fill="#0F172A">Orchestrator Contract:</tspan> Fail-Closed on Unsupported OS &middot; Strict SHA-256 Checksums &middot; Zero Fuzz Tolerance &middot; Defense-in-Depth Runtime Caps
  </text>
  <rect x="805" y="616" width="145" height="26" rx="13" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
  <text x="877" y="633" text-anchor="middle" font-family="Calibri, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803D">ALL GATES PASS (100%)</text>
</svg>
