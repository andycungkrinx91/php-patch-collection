<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="33%" stop-color="#0D9488" />
      <stop offset="66%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>

  <style>
    .title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #0F172A; }
    .subtitle { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; fill: #64748B; }
    .badge { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #1D4ED8; }
    .node-title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0F172A; }
    .node-desc { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; fill: #475569; }
    .node-code { font-family: Consolas, 'Fira Code', monospace; font-size: 9.5px; fill: #2563EB; }
    .mode-title { font-family: Calibri, 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1000" height="660" fill="#FFFFFF" rx="10" />

  <!-- Header -->
  <text x="35" y="38" class="title">universal-autopatch-109618-109619.sh &mdash; Exact Execution &amp; Mode Flow</text>
  <text x="35" y="56" class="subtitle">Environment &amp; OS Discovery &middot; Scope Gates &middot; Cryptographic Verification &middot; Mode Branching &middot; Safe Rollback</text>

  <rect x="835" y="22" width="130" height="24" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
  <text x="900" y="38" text-anchor="middle" class="badge">UNIVERSAL ENGINE</text>

  <!-- Accent Ribbon -->
  <rect x="35" y="68" width="930" height="4" rx="2" fill="url(#ribbonGrad)" />

  <!-- ROW 1: Stages 1 -> 2 -> 3 -->
  <!-- Stage 1: main() CLI Parsing -->
  <rect x="35" y="90" width="270" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="58" cy="115" r="13" fill="#2563EB" />
  <text x="58" y="119" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">1</text>
  <text x="80" y="114" class="node-title">CLI Flags &amp; Modes (main)</text>
  <text x="80" y="130" class="node-desc">Parses: --preview, --apply, --rollback</text>
  <text x="80" y="144" class="node-code">Flags: --php-version, --source-dir, --build-binary</text>
  <text x="80" y="158" class="node-desc">If --rollback: jumps directly to restore</text>

  <line x1="305" y1="132" x2="365" y2="132" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 2: detect_environment() -->
  <rect x="370" y="90" width="270" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="393" cy="115" r="13" fill="#2563EB" />
  <text x="393" y="119" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">2</text>
  <text x="415" y="114" class="node-title">detect_environment()</text>
  <text x="415" y="130" class="node-desc">Probes virtualization environment:</text>
  <text x="415" y="144" class="node-code">systemd-detect-virt | /.dockerenv</text>
  <text x="415" y="158" class="node-desc">Identifies: Bare-Metal, LXC, Docker, VM</text>

  <line x1="640" y1="132" x2="700" y2="132" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 3: detect_os() -->
  <rect x="705" y="90" width="260" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="728" cy="115" r="13" fill="#2563EB" />
  <text x="728" y="119" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">3</text>
  <text x="750" y="114" class="node-title">detect_os() &amp; Red Hat Guard</text>
  <text x="750" y="130" class="node-desc">Parses /etc/os-release &amp; release files</text>
  <text x="750" y="144" class="node-code">Ubuntu · Debian · CentOS · Alpine</text>
  <text x="750" y="158" class="node-desc" fill="#B91C1C">Fail-closed: Halts on unmanaged RHEL</text>

  <!-- Connector from Row 1 to Row 2 -->
  <path d="M 835 175 L 835 205 L 165 205 L 165 225" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ROW 2: Stages 4 & 5 -->
  <!-- Stage 4: detect_php() -->
  <rect x="35" y="230" width="445" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="58" cy="255" r="13" fill="#2563EB" />
  <text x="58" y="259" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">4</text>
  <text x="80" y="254" class="node-title">detect_php() &amp; Version Scope Enforcement</text>
  <text x="80" y="270" class="node-desc">Probes CLI (php -v, php -r) and active systemd/service FPM daemons (php&lt;ver&gt;-fpm)</text>
  <text x="80" y="285" class="node-code">Identifies Major (5, 7, 8), Minor (5.5 - 8.1), Point (e.g. 7.4.33)</text>
  <text x="80" y="300" class="node-desc">Scope Check: Halts if multiple versions ambiguous without --php-version; Halts if &lt; 5.5 or &ge; 8.2</text>

  <line x1="480" y1="275" x2="520" y2="275" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 5: select_and_verify_patch() -->
  <rect x="525" y="230" width="440" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)" />
  <circle cx="548" cy="255" r="13" fill="#0D9488" />
  <text x="548" y="259" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">5</text>
  <text x="570" y="254" class="node-title">select_and_verify_patch() &amp; SHA-256 Gate</text>
  <text x="570" y="270" class="node-desc">Resolves php${TARGET_PHP_VERSION}-cve-109618-109619.patch</text>
  <text x="570" y="285" class="node-code">assert(sha256(patch_file) == EXPECTED_SHA256_PHP*)</text>
  <text x="570" y="300" class="node-desc">Halts on checksum mismatch. Sets PATCH_STATUS="VERIFIED". Zero-fuzz integrity.</text>

  <!-- Forking to 4 Execution Branches -->
  <path d="M 745 320 L 745 350 L 140 350 L 140 370" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 370 350 L 370 370" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 620 350 L 620 370" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 865 350 L 865 370" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ROW 3: Distinct Execution Modes -->
  <!-- Branch A: --preview -->
  <rect x="35" y="375" width="215" height="185" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="35" y="375" width="215" height="26" rx="8" fill="#F1F5F9" />
  <text x="45" y="392" class="mode-title" fill="#334155">Mode: --preview</text>
  <text x="45" y="415" class="node-desc" font-weight="700">execute_preview()</text>
  <text x="45" y="430" class="node-desc">&bull; Zero file mutations</text>
  <text x="45" y="445" class="node-desc">&bull; Probes candidate conf.d</text>
  <text x="45" y="460" class="node-desc">&bull; Probes /etc/nginx/snippets/</text>
  <text x="45" y="475" class="node-desc">&bull; Probes systemd units</text>
  <text x="45" y="490" class="node-desc">&bull; Runs dry-run on --source-dir</text>
  <text x="45" y="510" class="node-code" fill="#64748B">Result: Safe inspection report</text>
  <text x="45" y="530" class="node-desc">Prompts to re-run with --apply</text>

  <!-- Branch B: --apply -->
  <rect x="265" y="375" width="225" height="185" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2" filter="url(#cardShadow)" />
  <rect x="265" y="375" width="225" height="26" rx="8" fill="#DCFCE7" />
  <text x="275" y="392" class="mode-title" fill="#15803D">Mode: --apply (Config)</text>
  <text x="275" y="415" class="node-desc" font-weight="700">execute_apply()</text>
  <text x="275" y="430" class="node-desc">&bull; Requires root (EUID == 0)</text>
  <text x="275" y="445" class="node-desc">&bull; Creates /var/backups/ dir</text>
  <text x="275" y="460" class="node-desc">&bull; Deploys 99-cve-hardening.ini</text>
  <text x="275" y="475" class="node-desc">&bull; Deploys Nginx snippet</text>
  <text x="275" y="490" class="node-desc">&bull; Restarts FPM daemon</text>
  <text x="275" y="505" class="node-desc">&bull; Runs smoke check (php -v)</text>
  <text x="275" y="525" class="node-code" fill="#15803D">Writes manifest.txt for rollback</text>
  <text x="275" y="542" class="node-desc" font-weight="700" fill="#166534">&check; Production-Safe Mitigation</text>

  <!-- Branch C: --build-binary -->
  <rect x="505" y="375" width="230" height="185" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="505" y="375" width="230" height="26" rx="8" fill="#FEF3C7" />
  <text x="515" y="392" class="mode-title" fill="#92400E">Flag: --build-binary</text>
  <text x="515" y="415" class="node-desc" font-weight="700">Delegated Sub-Execution</text>
  <text x="515" y="430" class="node-desc">&bull; Checks compile-and-patch-vm-cve.sh</text>
  <text x="515" y="445" class="node-desc">&bull; Invokes: compile-and-patch-vm-cve.sh</text>
  <text x="515" y="460" class="node-desc">&bull; Downloads upstream source</text>
  <text x="515" y="475" class="node-desc">&bull; Patches &amp; compiles binaries</text>
  <text x="515" y="490" class="node-desc">&bull; Hot-swaps php and php-fpm</text>
  <text x="515" y="505" class="node-desc">&bull; Returns 0 upon completion</text>
  <text x="515" y="525" class="node-code" fill="#92400E">return 0 (clean handoff)</text>
  <text x="515" y="542" class="node-desc">Exits before INI drop-in phase</text>

  <!-- Branch D: --rollback -->
  <rect x="750" y="375" width="215" height="185" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="750" y="375" width="215" height="26" rx="8" fill="#FEE2E2" />
  <text x="760" y="392" class="mode-title" fill="#991B1B">Mode: --rollback [dir]</text>
  <text x="760" y="415" class="node-desc" font-weight="700">execute_rollback()</text>
  <text x="760" y="430" class="node-desc">&bull; Requires root (EUID == 0)</text>
  <text x="760" y="445" class="node-desc">&bull; Reads target manifest.txt</text>
  <text x="760" y="460" class="node-desc">&bull; Removes installed drop-ins</text>
  <text x="760" y="475" class="node-desc">&bull; Restores .bak INI &amp; Nginx</text>
  <text x="760" y="490" class="node-desc">&bull; Restores .orig binary</text>
  <text x="760" y="505" class="node-desc">&bull; Restarts PHP-FPM service</text>
  <text x="760" y="525" class="node-code" fill="#991B1B">Atomic baseline restoration</text>
  <text x="760" y="542" class="node-desc">Zero manual file cleanup</text>

  <!-- Footer Banner -->
  <rect x="35" y="580" width="930" height="45" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="50" y="607" font-family="Calibri, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">
    <tspan font-weight="700" fill="#0F172A">Code Realities:</tspan> --apply and --build-binary are separate branches &middot; Fail-closed OS check halts on RHEL &middot; SHA-256 assertions pin patches &middot; manifest.txt powers atomic rollback
  </text>
</svg>
