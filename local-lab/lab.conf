# ==============================================================================
# local-lab/lab.conf
#
# Single source of truth for the PHP2Shell local lab topology.
# Every script in scripts/ sources this file. Change a value here, not in a script.
# ==============================================================================

# --- Isolated lab network -----------------------------------------------------
# Lab traffic never reaches the internet. ipv4.nat=false plus an egress ACL that
# rejects everything is what makes the containment claim true.
LAB_BRIDGE="${LAB_BRIDGE:-labbr0}"
LAB_SUBNET="${LAB_SUBNET:-10.77.77.0/24}"
LAB_GATEWAY="${LAB_GATEWAY:-10.77.77.1}"
LAB_ACL="${LAB_ACL:-lab-egress}"

# --- Temporary provisioning network -------------------------------------------
# Only exists while packages are being installed. Created by
# scripts/10-open-provisioning.sh and removed by scripts/11-close-provisioning.sh.
# Never leave this attached to a target after a scan.
PROV_BRIDGE="${PROV_BRIDGE:-labprov0}"
PROV_SUBNET="${PROV_SUBNET:-10.66.66.0/24}"
PROV_GATEWAY="${PROV_GATEWAY:-10.66.66.1}"
PROV_ACL="${PROV_ACL:-labprov-egress}"

# --- Attacker box -------------------------------------------------------------
ATTACKER_NAME="${ATTACKER_NAME:-akatsuki-lab}"
ATTACKER_IMAGE="${ATTACKER_IMAGE:-images:debian/12}"
ATTACKER_MEMORY="${ATTACKER_MEMORY:-4GiB}"
ATTACKER_CPUS="${ATTACKER_CPUS:-2}"
ATTACKER_ARCHIVE_IMAGE="${ATTACKER_ARCHIVE_IMAGE:-archive-assets/akatsuki-lab.tar.gz}"

# --- Target matrix ------------------------------------------------------------
# name|image|memory|cpus|php_install_command
# image must resolve against the LXD `images:` or `ubuntu:` remote.
# php_install_command runs inside the container before it is moved onto LAB_BRIDGE.
#
# Coverage rationale:
#   trusty/legacy/focal/bionic  -> old Ubuntu, PHP 5.5 through 7.4, distro layout
#   jammy                       -> PHP 8.1, vendor-patched upstream (regression control)
#   debian12/alpine/alpine322   -> PHP 8.2/8.3, already on a fixed release
#   centos9/centos10            -> CentOS Stream, current RHEL upstream
#   php74/80/81-mitigation      -> self-built patched FPM binaries
#
# Scope note: RHEL and its rebuilds (RHEL, AlmaLinux, Rocky, Oracle Linux) are
# deliberately NOT in this matrix. Red Hat ships an official fix for both CVEs
# through errata (ALSA-2026:87073 / 87080 for EL8, ALSA-2026:87072 / 87079 for
# EL9), so a third-party backport is redundant there and risks conflicting with
# the vendor package. Those hosts belong on the distro's own update channel.
# The targets below are either EOL with no vendor patch, or a verification
# control for a vendor fix that already exists.

# --- Out-of-scope hosts -------------------------------------------------------
# Retained only as documentation. Do not provision these. Populate only if you
# are deliberately re-adding vendor-patched platforms for a comparison run.
OUT_OF_SCOPE_TARGETS=(
  "rhel8-test-lxc|images:almalinux/8|Vendor-patched via ALSA-2026:87073, ALSA-2026:87080"
  "rhel9-test-lxc|images:almalinux/9|Vendor-patched via ALSA-2026:87072, ALSA-2026:87079"
)
# --- In-scope targets (PHP 5.5 through 8.1) -----------------------------------
# Six hosts provision from a base image. php56-test-lxc, php71-test-lxc and
# php73-test-lxc are clones of bionic-test-lxc / php74-mitigation and are listed
# under CLONE_TARGETS below; they are not provisioned from an image.
TARGETS=(
  "php-trusty-lxc|ubuntu:14.04|1GiB|1|DEBIAN_FRONTEND=noninteractive apt-get install -y php5-fpm php5-cli nginx"
  "php-legacy-lxc|ubuntu:16.04|1GiB|1|DEBIAN_FRONTEND=noninteractive apt-get install -y php7.0-fpm php7.0-cli nginx"
  "bionic-test-lxc|ubuntu:18.04|1GiB|1|DEBIAN_FRONTEND=noninteractive apt-get install -y php7.2-fpm php7.2-cli nginx"
  "php74-mitigation|ubuntu:20.04|2GiB|2|DEBIAN_FRONTEND=noninteractive apt-get install -y nginx"
  "php80-mitigation|ubuntu:22.04|1GiB|1|DEBIAN_FRONTEND=noninteractive apt-get install -y nginx"
  "php81-mitigation|ubuntu:22.04|1GiB|1|DEBIAN_FRONTEND=noninteractive apt-get install -y nginx"
)

# --- Clone targets ------------------------------------------------------------
# Created with `lxc copy`, so they inherit a complete PHP build toolchain without
# needing package access. Each serves its own branch through a dedicated FPM pool
# on a loopback port; the packaged 7.2 / 7.4 service is untouched.
#   format: name|source|PHP branch
CLONE_TARGETS=(
  "php56-test-lxc|bionic-test-lxc|5.6"
  "php71-test-lxc|bionic-test-lxc|7.1"
  "php73-test-lxc|php74-mitigation|7.3"
)

# --- Runtime hardening caps ---------------------------------------------------
# These are the caps that actually stop the php2shell probe. They are applied by
# scripts/30-harden-targets.sh and asserted by scripts/60-verify-hardening.sh.
#
# Why these values: the php2shell multipart probe nests ~62 levels of array
# brackets and sends hundreds of thousands of part-header lines. max_input_nesting_level
# and max_input_vars reject the structure before it reaches the vulnerable parser.
# post_max_size discards the oversized body at the PHP layer.
#
# DO NOT set Nginx client_max_body_size instead: Nginx answers 413, the probe never
# completes, and the scanner reports INCONCLUSIVE rather than a clean verdict.
CAP_MAX_INPUT_NESTING_LEVEL="${CAP_MAX_INPUT_NESTING_LEVEL:-20}"
CAP_MAX_INPUT_VARS="${CAP_MAX_INPUT_VARS:-200}"
CAP_MAX_INPUT_TIME="${CAP_MAX_INPUT_TIME:-60}"
CAP_POST_MAX_SIZE="${CAP_POST_MAX_SIZE:-900K}"
CAP_UPLOAD_PROGRESS="${CAP_UPLOAD_PROGRESS:-Off}"

# The web server's own request cap must stay above the largest probe or PHP never
# sees the body and cannot return a clean 200.
#
# Measured: the scanner sends three probes sized 1 MiB, 8 MiB and 20 MiB
# (PROBES = ((1, 4000), (8, 1020), (20, 1020)) in scanner.py; the first tuple
# element is the size in MiB). Any finite cap below 20 MiB rejects the larger
# probes with 413 and the scanner reports INCONCLUSIVE - which reads as "blocked"
# when the truth is "never tested".
#
# 0 means unlimited, and is the value every working target in this lab uses.
# PHP's post_max_size is the layer that discards; nginx must not pre-empt it.
NGINX_CLIENT_MAX_BODY_SIZE="${NGINX_CLIENT_MAX_BODY_SIZE:-0}"

# --- Report bind mount --------------------------------------------------------
# LXD maps container root to host uid 1000000 under the default idmap. The host
# directory must be owned by that uid or the container cannot write to it.
REPORTS_HOST_DIR="${REPORTS_HOST_DIR:-/opt/lab-reports/akatsuki}"
REPORTS_MOUNT_PATH="${REPORTS_MOUNT_PATH:-/mnt/reports}"
IDMAP_HOST_UID="${IDMAP_HOST_UID:-1000000}"
IDMAP_HOST_GID="${IDMAP_HOST_GID:-1000}"

# --- Artifacts ----------------------------------------------------------------
LAB_DATE="${LAB_DATE:-$(date +%Y-%m-%d)}"
SNAPSHOT_PREFIX="${SNAPSHOT_PREFIX:-baseline-${LAB_DATE}}"
